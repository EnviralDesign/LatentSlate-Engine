[runnable_recipe]
key = "z-image-turbo.text-to-image.comfy-int8-convrot"
name = "Z-Image Turbo — Comfy INT8 ConvRot Text to Image"
description = "Recommended Engine-native Turbo T2I path: exact stored INT8 ConvRot transformer, mixed FP8/NVFP4 Qwen, 1024x1024, 8 steps, BasicGuider positive-only conditioning, AuraFlow shift 3, and res_multistep/simple."
family = "zimage"
base_tool = "zimage.turbo_text_to_image"
tags = ["builtin", "recommended", "hardware-proven", "engine-native", "kitchen", "z-image", "turbo", "t2i", "int8", "convrot", "comfy-org"]

[runnable_recipe.recipe]
type = "z_image_turbo_t2i"
base_model = "comfy-org-z-image-turbo-int8-convrot"
pipeline_support = "model:zimage:tongyi-mai-z-image-turbo/pipeline-support"
transformer = "model:zimage:comfy-org-z-image-turbo/z_image_turbo_int8_convrot"
text_encoder = "model:zimage:comfy-org-z-image-turbo/qwen_3_4b_fp8_mixed"
vae = "model:zimage:comfy-org-z-image-turbo/ae"
operation = "zimage_turbo_t2i_int8_convrot"

[runnable_recipe.optimizations]
keep_pipeline_loaded = true
