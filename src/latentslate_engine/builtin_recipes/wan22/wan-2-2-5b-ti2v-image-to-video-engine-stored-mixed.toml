[runnable_recipe]
key = "wan-2-2-5b-ti2v.image-to-video.engine-stored-mixed"
name = "Wan 2.2 TI2V 5B — Image to Video (FP16 Transformer + FP8 Text)"
description = "Recommended Engine-native strict first-frame TI2V operation with the exact FP16 transformer, FP32 VAE compute, stored-FP8 UMT5 encoder, direct Kitchen dispatch, staged residency, and one disposable worker per job."
family = "wan22"
base_tool = "wan22.image_to_video"
tags = ["builtin", "recommended", "hardware-proven", "engine-native", "kitchen", "ti2v", "5b", "image-to-video", "strict-first-frame", "fp16-transformer", "fp8-text-encoder", "stored-mixed-precision"]

[runnable_recipe.recipe]
type = "wan5_kitchen"
base_model = "Wan-AI/Wan2.2-TI2V-5B-Diffusers"
operation = "wan5_i2v"
pipeline_support = "model:wan22:ti2v-5b/support"
transformer = "model:wan22:ti2v-5b/wan2.2_ti2v_5b_fp16"
text_encoder = "model:wan22:ti2v-5b/umt5_xxl_fp8_e4m3fn_scaled"
vae = "model:wan22:ti2v-5b/wan2.2_vae"

[runnable_recipe.inputs.prompt]
source = "prompt"

[runnable_recipe.inputs.start_image]
source = "start_image"

[runnable_recipe.inputs.width]
source = "width"

[runnable_recipe.inputs.width.ui]
group = "Output"
min = 64
step = 32
unit = "pixels"

[runnable_recipe.inputs.height]
source = "height"

[runnable_recipe.inputs.height.ui]
group = "Output"
min = 64
step = 32
unit = "pixels"

[runnable_recipe.inputs.duration_seconds]
source = "duration_seconds"

[runnable_recipe.inputs.seed]
source = "seed"

[runnable_recipe.optimizations]
attention = "native"
offload = "staged"
quantization = "fp8"
cache = "none"
keep_pipeline_loaded = false
