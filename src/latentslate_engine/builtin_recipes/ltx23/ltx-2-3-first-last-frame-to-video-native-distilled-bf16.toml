# Pinned official Comfy FLF topology at workflow_templates 2b7f823 uses the
# separately stored Distilled FP8 checkpoint and a Comfy Gemma encoder. This
# native BF16 Diffusers recipe remains a distinct reference operation while it
# mirrors the ordered endpoints: first image at frame zero, last image at -1.
[runnable_recipe]
key = "ltx-2-3.first-last-frame-to-video.native-distilled-bf16"
name = "LTX 2.3 Distilled — First + Last Frame to Video"
description = "Exact native BF16 Distilled first+last-frame-conditioned video with synchronized audio. Both ordered endpoints are required; this recipe is not an ordinary first-frame I2V variant."
family = "ltx23"
base_tool = "ltx23.first_last_frame_to_video"
tags = ["builtin", "reference", "native-diffusers", "distilled", "first-last-frame", "synchronized-audio", "exact-closure"]

[runnable_recipe.model]
resource = "model:ltx23:diffusers--ltx-2.3-distilled-diffusers"

[runnable_recipe.inputs.prompt]
source = "prompt"

[runnable_recipe.inputs.start_image]
source = "start_image"

[runnable_recipe.inputs.end_image]
source = "end_image"
required = true

[runnable_recipe.inputs.width]
source = "width"

[runnable_recipe.inputs.height]
source = "height"

[runnable_recipe.inputs.duration_seconds]
source = "duration_seconds"

[runnable_recipe.inputs.seed]
source = "seed"

[runnable_recipe.optimizations]
attention = "native"
offload = "sequential"
quantization = "bf16"
cache = "none"
