description = "Dense Distilled BF16 Diffusers reference closure for first-frame-conditioned synchronized video/audio. This approximately 95 GB reference path is separate from the practical Dev FP8 main denoiser plus Distilled LoRA recipe and from the first+last endpoint operation."
