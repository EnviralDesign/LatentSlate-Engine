[runnable_recipe]
key = "ltx-2-3.first-last-frame-to-video.comfy-distilled-fp8"
name = "LTX 2.3 Distilled FP8 — First and Last Frame to Video"
description = "Exact current official Comfy one-stage Distilled FP8 first+last-frame graph with ordered endpoint guides and synchronized audio/video checkpoint closure."
family = "ltx23"
base_tool = "ltx23.first_last_frame_to_video"
tags = ["builtin", "experimental", "ltx2.3", "first-last-frame", "comfy-org", "distilled", "fp8", "synchronized-audio", "exact-template"]

[runnable_recipe.recipe]
type = "ltx23_comfy_distilled_flf"
base_model = "Lightricks/LTX-2.3"
checkpoint = "model:ltx23:lightricks-ltx-2.3-fp8/distilled-fp8"
text_encoder = "model:ltx23:comfy-org-ltx-2/gemma-3-12b-it-fp4-mixed"

[runnable_recipe.optimizations]
quantization = "fp8"
cache = "none"
keep_pipeline_loaded = false

[runnable_recipe.inputs.prompt]
source = "prompt"

[runnable_recipe.inputs.start_image]
source = "start_image"

[runnable_recipe.inputs.end_image]
source = "end_image"
required = true

[runnable_recipe.inputs.width]
source = "width"

[runnable_recipe.inputs.width.ui]
group = "Output"
min = 64
step = 32
unit = "pixels"

[runnable_recipe.inputs.height]
source = "height"

[runnable_recipe.inputs.height.ui]
group = "Output"
min = 64
step = 32
unit = "pixels"

[runnable_recipe.inputs.duration_seconds]
source = "duration_seconds"

[runnable_recipe.inputs.duration_seconds.ui]
group = "Output"
min = 1
max = 10
step = 1
unit = "seconds"

[runnable_recipe.inputs.seed]
source = "seed"
