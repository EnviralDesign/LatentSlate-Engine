[runnable_recipe]
key = "ltx-2-3.first-last-frame-to-video.kitchen-distilled-fp8"
name = "LTX 2.3 Distilled FP8 — First + Last Frame to Video"
description = "Engine-native Distilled FP8 synchronized video/audio with ordered first/last guides and direct Kitchen dispatch. Both endpoint images are required."
family = "ltx23"
base_tool = "ltx23.first_last_frame_to_video"
tags = ["builtin", "experimental", "engine-native", "kitchen", "distilled", "fp8", "first-last-frame", "synchronized-audio"]

[runnable_recipe.recipe]
type = "ltx23_kitchen"
base_model = "Lightricks/LTX-2.3"
operation = "ltx23_distilled_flf"
pipeline_support = "model:ltx23:optimized-pipeline-support"
checkpoint = "model:ltx23:checkpoints/ltx-2.3-22b-distilled-fp8"
text_encoder = "model:ltx23:text_encoders/gemma_3_12b_it_fp4_mixed"

[runnable_recipe.inputs.prompt]
source = "prompt"

[runnable_recipe.inputs.start_image]
source = "start_image"

[runnable_recipe.inputs.end_image]
source = "end_image"

[runnable_recipe.inputs.width]
source = "width"
label = "Width (32px grid)"

[runnable_recipe.inputs.width.ui]
group = "Output"
min = 64
step = 32
unit = "pixels"

[runnable_recipe.inputs.height]
source = "height"
label = "Height (32px grid)"

[runnable_recipe.inputs.height.ui]
group = "Output"
min = 64
step = 32
unit = "pixels"

[runnable_recipe.inputs.duration_seconds]
source = "duration_seconds"

[runnable_recipe.inputs.seed]
source = "seed"

[runnable_recipe.optimizations]
attention = "native"
offload = "staged"
quantization = "fp8"
cache = "none"
keep_pipeline_loaded = false
