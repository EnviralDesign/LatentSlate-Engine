[runnable_recipe]
key = "ltx-2-3.image-to-video.comfy-dev-fp8"
name = "LTX 2.3 Dev FP8 + Distilled LoRA — Image to Video"
description = "Exact current official Comfy two-stage Dev FP8 first-frame image-to-video graph, including fixed Distilled model LoRA, Gemma prompt path, spatial x2 upscaler, and synchronized audio/video checkpoint closure."
family = "ltx23"
base_tool = "ltx23.image_to_video"
tags = ["builtin", "experimental", "ltx2.3", "i2v", "comfy-org", "dev", "fp8", "distilled-lora", "synchronized-audio", "exact-template"]

[runnable_recipe.recipe]
type = "ltx23_comfy_dev_i2v"
base_model = "Lightricks/LTX-2.3"
checkpoint = "model:ltx23:comfy/checkpoints/ltx-2.3-22b-dev-fp8"
text_encoder = "model:ltx23:comfy/text_encoders/gemma_3_12b_it_fp4_mixed"
model_lora = "lora:ltx23:comfy/ltx_2.3_22b_distilled_1.1_lora_dynamic_fro09_avg_rank_111_bf16"
text_lora = "lora:ltx23:comfy/gemma-3-12b-it-abliterated_lora_rank64_bf16"
latent_upscaler = "model:ltx23:comfy/latent_upscale_models/ltx-2.3-spatial-upscaler-x2-1.1"

[runnable_recipe.optimizations]
quantization = "fp8"
cache = "none"
keep_pipeline_loaded = false

[runnable_recipe.inputs.prompt]
source = "prompt"

[runnable_recipe.inputs.start_image]
source = "start_image"

[runnable_recipe.inputs.width]
source = "width"

[runnable_recipe.inputs.width.ui]
group = "Output"
min = 64
step = 64
unit = "pixels"

[runnable_recipe.inputs.height]
source = "height"

[runnable_recipe.inputs.height.ui]
group = "Output"
min = 64
step = 64
unit = "pixels"

[runnable_recipe.inputs.duration_seconds]
source = "duration_seconds"

[runnable_recipe.inputs.duration_seconds.ui]
group = "Output"
min = 1
max = 10
step = 1
unit = "seconds"

[runnable_recipe.inputs.seed]
source = "seed"
