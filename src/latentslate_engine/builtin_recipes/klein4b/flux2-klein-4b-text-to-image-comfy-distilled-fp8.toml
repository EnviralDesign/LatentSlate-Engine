# Comfy workflow-template package v0.1.37: distilled FP8, 4 steps, CFG 1.
[runnable_recipe]
key = "flux2-klein-4b.text-to-image.comfy-distilled-fp8"
name = "Klein 4B Comfy FP8 — Text to Image"
description = "Practical Comfy-aligned distilled Klein 4B text generation using exact standalone transformer, encoder, and VAE roles."
family = "klein4b"
base_tool = "flux2_klein4b.text_to_image"
tags = ["builtin", "comfy", "distilled", "fp8", "text-to-image", "fallback"]

[runnable_recipe.recipe]
type = "klein4_stored"
mode = "distilled"
base_model = "flux2-klein-4b-distilled"
steps = 4
guidance_scale = 1.0
pipeline_support = "model:klein4b:support/comfy-distilled-pipeline-support"
transformer = "model:klein4b:transformers/flux-2-klein-4b-fp8"
text_encoder = "model:klein4b:text_encoders/qwen_3_4b"
vae = "model:klein4b:vae/flux2-vae"

[runnable_recipe.optimizations]
attention = "native"
offload = "staged"
quantization = "fp8"
