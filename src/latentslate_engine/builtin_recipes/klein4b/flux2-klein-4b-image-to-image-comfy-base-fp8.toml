# Current Comfy blueprint: base FP8, 20 steps, CFG 5.
[runnable_recipe]
key = "flux2-klein-4b.image-to-image.comfy-base-fp8"
name = "Klein 4B Comfy FP8 — Image to Image"
description = "Practical current-Comfy Klein Base 4B image editing using the exact standalone transformer, encoder, and small-decoder VAE roles."
family = "klein4b"
base_tool = "flux2_klein4b.image_to_image"
tags = ["builtin", "comfy", "base", "fp8", "image-to-image", "recommended"]

[runnable_recipe.recipe]
type = "klein4_comfy"
mode = "base"
base_model = "flux2-klein-base-4b"
steps = 20
guidance_scale = 5.0
pipeline_support = "model:klein4b:support/comfy-base-pipeline-support"
transformer = "model:klein4b:transformers/flux-2-klein-base-4b-fp8"
text_encoder = "model:klein4b:text_encoders/qwen_3_4b"
vae = "model:klein4b:vae/full_encoder_small_decoder"

[runnable_recipe.optimizations]
attention = "native"
offload = "staged"
quantization = "fp8"
