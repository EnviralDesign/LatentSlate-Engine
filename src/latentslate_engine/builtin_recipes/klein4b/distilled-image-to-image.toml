# Family/workflow provenance: ComfyUI workflow templates v0.1.37 use Klein's
# standalone FP8 transformer plus component artifacts. This clean-room Engine
# baseline substitutes one complete native BF16 Diffusers folder.
[runnable_recipe]
key = "klein4b.distilled.image-to-image"
