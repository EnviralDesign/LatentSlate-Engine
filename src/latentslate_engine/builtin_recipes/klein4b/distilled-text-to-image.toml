# Family/workflow provenance: ComfyUI workflow templates v0.1.37 use Klein's
# standalone transformer plus separate component artifacts. This clean-room Engine
# baseline intentionally substitutes one complete native BF16 Diffusers folder.
[runnable_recipe]
key = "klein4b.reference-bf16.text-to-image"
name = "Klein 4B Reference BF16 — Text to Image"
description = "Complete native-BF16 source-of-truth path for quality and optimization comparisons; not the practical Comfy default."
family = "klein4b"
base_tool = "flux2_klein4b.text_to_image"
tags = ["builtin", "reference", "source-of-truth", "native-diffusers", "text-to-image"]

[runnable_recipe.model]
resource = "model:klein4b:black-forest-labs--flux.2-klein-4b"

[runnable_recipe.optimizations]
attention = "native"
offload = "model"
quantization = "bf16"
