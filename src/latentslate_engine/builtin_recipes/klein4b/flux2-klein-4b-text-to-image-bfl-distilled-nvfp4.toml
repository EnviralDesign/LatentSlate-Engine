# Experimental BFL NVFP4 transformer on the pinned official Distilled T2I closure.
[runnable_recipe]
key = "flux2-klein-4b.text-to-image.bfl-distilled-nvfp4"
name = "Klein 4B BFL NVFP4 — Text to Image (Experimental)"
description = "Experimental native-NVFP4 challenger that changes only the transformer in the official Distilled 4-step T2I closure."
family = "klein4b"
base_tool = "flux2_klein4b.text_to_image"
tags = ["builtin", "experimental", "distilled", "nvfp4", "text-to-image"]

[runnable_recipe.recipe]
type = "klein4_comfy"
mode = "distilled"
base_model = "flux2-klein-4b-distilled"
steps = 4
guidance_scale = 1.0
pipeline_support = "model:klein4b:support/comfy-distilled-pipeline-support"
transformer = "model:klein4b:transformers/flux-2-klein-4b-nvfp4"
text_encoder = "model:klein4b:text_encoders/qwen_3_4b"
vae = "model:klein4b:vae/flux2-vae"

[runnable_recipe.optimizations]
attention = "native"
offload = "staged"
quantization = "nvfp4"
