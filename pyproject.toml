[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "latentslate-engine"
version = "0.1.0"
description = "Opinionated generation engine for LatentSlate"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { file = "LICENSE" }
authors = [{ name = "Enviral Design" }]
dependencies = [
  "fastapi>=0.115",
  "huggingface-hub>=0.34",
  "pydantic>=2.10",
  "python-dotenv>=1.1",
  "python-multipart>=0.0.20",
  "rich>=13.9",
  "uvicorn[standard]>=0.34",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28",
  "pytest>=8.3",
  "ruff>=0.12",
]
nvidia-cu130 = [
  "comfy-kitchen[cublas]==0.2.28",
  "torch==2.11.0",
]
nvidia-cu128 = [
  "comfy-kitchen==0.2.28",
  "torch==2.11.0",
]
# This intentionally empty extra makes the protocol-only tier explicit in
# locked `uv sync` commands. Plain `uv sync` is equivalent to this tier.
protocol = []

# The shared inference packages are separate from the mutually-exclusive
# accelerator extras below. This keeps a plain `uv sync` useful for protocol
# tooling while the bootstrap selects one tested GPU tier deterministically.
[dependency-groups]
runtime = [
  "accelerate==1.10.1",
  "av>=14",
  "diffusers @ git+https://github.com/huggingface/diffusers.git@f53d552036a0d1bd5570782a39cd40cfabf112bc",
  "ftfy>=6.3",
  "kernels==0.14.1; sys_platform == 'linux' or sys_platform == 'win32'",
  "numpy>=2.0",
  "peft==0.19.0",
  "pillow>=11",
  "protobuf>=5",
  "safetensors>=0.5",
  "sentencepiece>=0.2",
  "transformers==5.9.0",
]

[project.scripts]
latentslate-engine = "latentslate_engine.__main__:main"

[tool.uv]
conflicts = [
  [
    { extra = "nvidia-cu130" },
    { extra = "nvidia-cu128" },
  ],
  [
    { extra = "nvidia-cu130" },
    { extra = "protocol" },
  ],
  [
    { extra = "nvidia-cu128" },
    { extra = "protocol" },
  ],
]

# PyPI intentionally supplies CPU-only PyTorch wheels on Windows. The
# mutually-exclusive extras use official PyTorch CUDA indexes and are locked
# together; the bootstrap selects one after checking the driver and GPU.
[tool.uv.sources]
torch = [
  { index = "pytorch-cu130", extra = "nvidia-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
  { index = "pytorch-cu128", extra = "nvidia-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/latentslate_engine"]
include = ["src/latentslate_engine/authoring_web/**"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
