name: Adjust H3 presets

on:
  push:
    branches:
      - agent/latent-engine-v0

permissions:
  contents: write

jobs:
  adjust:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/latent-engine-v0
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Keep presets inside the consumer-memory canvas
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              "src/latentslate_engine/runtime/h3.py": (
                  '    "final": H3Preset(width=1344, height=768, steps=25),',
                  '    "final": H3Preset(width=960, height=544, steps=30),',
              ),
              "src/latentslate_engine/tools/h3.py": (
                  'ChoiceOption(value="final", label="Final", description="1344×768, 25 steps"),',
                  'ChoiceOption(value="final", label="Final", description="960×544, 30 steps"),',
              ),
          }
          for filename, (old, new) in replacements.items():
              path = Path(filename)
              text = path.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f"Expected one preset match in {filename}")
              path.write_text(text.replace(old, new, 1))
          PY
      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Validate
        run: |
          pytest -q
          python -m compileall -q src tests
      - name: Remove temporary workflow
        run: rm .github/workflows/adjust-h3-presets.yml
      - name: Commit validated preset
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "keep H3 presets within consumer canvas"
          git push origin HEAD:agent/latent-engine-v0
