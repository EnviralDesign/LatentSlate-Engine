name: Portable contracts

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install lightweight test dependencies
        run: >-
          python -m pip install
          pytest==9.1.1 fastapi==0.141.1 httpx==0.28.1
          python-dotenv==1.2.2 python-multipart==0.0.32 pillow==12.3.0
      - name: Test portable recipe and service contracts
        run: >-
          python -m pytest -q
          tests/test_recipe.py tests/test_klein_recipe_policy.py
          tests/test_service.py tests/test_service_recipe_projection.py
          -m "not native"
