name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  protocol:
    name: protocol (${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install protocol test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run protocol and model-free tests
        # Native planner/materialization tests require the locked runtime group and
        # are covered by the Windows/Linux runtime-sync jobs below.
        run: >-
          pytest -q
          tests/test_acceptance_evidence.py
          tests/test_api.py
          tests/test_artifacts.py
          tests/test_doctor.py
          tests/test_hardware.py
          tests/test_model_store.py
          tests/test_native_wan_registry.py
          tests/test_protocol.py
          tests/test_resources_variants.py
          tests/test_recipe_handler_registry.py
          tests/test_runtime_api.py
          tests/test_runtime_architecture.py
          tests/test_runtime_disposable_worker.py
          tests/test_runtime_persistent_worker.py
          tests/test_runtime_signatures.py
          tests/test_runtime_worker_progress.py
          tests/test_runtime_worker_protocol.py
          tests/test_storage.py
      - name: Validate Hardware-proven evidence
        run: python scripts/acceptance-evidence.py validate
      - name: Check the full repository with Ruff
        if: matrix.python-version == '3.12'
        run: ruff check .
      - name: Compile Python sources
        run: python -m compileall -q src tests

  runtime-sync:
    name: runtime-sync (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.10.0"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Sync the actual default runtime group
        run: uv sync --python 3.12 --extra nvidia-cu130 --group runtime --extra dev --locked
      - name: Verify the universal lock is current
        run: git diff --exit-code -- uv.lock
      - name: Report resolved runtime versions
        run: >-
          uv run --python 3.12 --extra nvidia-cu130 --group runtime --extra dev --locked python -c
          "import importlib.metadata as m;
          packages = ('torch', 'diffusers', 'transformers', 'kernels', 'comfy-kitchen', 'sentencepiece', 'safetensors', 'av', 'peft', 'accelerate');
          [print(package, m.version(package)) for package in packages]"
      - name: Import native and Klein runtimes
        run: >-
          uv run --python 3.12 --extra nvidia-cu130 --group runtime --extra dev --locked python -c
          "from diffusers import Flux2KleinPipeline, Flux2Transformer2DModel;
          from latentslate_engine.runtime.video_output import encode_rgb_video_tensor;
          from latentslate_engine.runtime.wan22_i2v_runtime import NativeWanI2VRuntime, WanI2VRequest, validate_wan_i2v_request;
          from latentslate_engine.tools.wan22_native import NativeWan14BI2VTool;
          assert all((Flux2KleinPipeline, Flux2Transformer2DModel, encode_rgb_video_tensor, NativeWanI2VRuntime, WanI2VRequest, validate_wan_i2v_request, NativeWan14BI2VTool))"
      - name: Run the full locked runtime suite
        env:
          LATENTSLATE_ENGINE_HOME: ${{ runner.temp }}/latentslate-engine-data
        run: uv run --python 3.12 --extra nvidia-cu130 --group runtime --extra dev --locked pytest -q
      - name: Validate the default data and variant catalog
        env:
          LATENTSLATE_ENGINE_HOME: ${{ runner.temp }}/latentslate-engine-data
        run: |
          uv run --python 3.12 --extra nvidia-cu130 --group runtime --extra dev --locked latentslate-engine data init
          uv run --python 3.12 --extra nvidia-cu130 --group runtime --extra dev --locked latentslate-engine variants validate
      - name: Compile Python sources
        run: uv run --python 3.12 --extra nvidia-cu130 --group runtime --extra dev --locked python -m compileall -q src tests
      - name: Verify tests left the repository clean
        run: git diff --exit-code
