name: CI

on:
  push:
    branches:
      - main
      - agent/latent-engine-v0
  pull_request:

permissions:
  contents: read

jobs:
  protocol:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Protocol and job tests
        run: pytest -q
      - name: Compile Python sources
        run: python -m compileall -q src tests

  runtime-sync:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.0"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Sync the actual default runtime group
        run: uv sync --python 3.12 --extra dev
      - name: Verify the universal lock is current
        run: git diff --exit-code -- uv.lock
      - name: Report resolved runtime versions
        run: >-
          uv run python -c
          "import importlib.metadata as m;
          print('torch', m.version('torch'));
          print('diffusers', m.version('diffusers'));
          print('transformers', m.version('transformers'));
          print('kernels', m.version('kernels'));
          print('torchao', m.version('torchao'));
          print('nvidia-modelopt', m.version('nvidia-modelopt'));
          print('peft', m.version('peft'));
          print('accelerate', m.version('accelerate'))"
      - name: Import Klein runtime and run the full suite
        run: uv run pytest -q
